name: Android - build release APK and AAB
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kutch.jks"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS=kutch" >> "$GITHUB_ENV"
          else
            echo "No secrets found - using a temporary key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/kutch.jks" -alias kutch -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass temp12345 -keypass temp12345 -dname "CN=Kutch Business"
            echo "KS_PASS=temp12345" >> "$GITHUB_ENV"
            echo "KS_ALIAS=kutch" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/kutch.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KutchBusiness-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KutchBusiness-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
